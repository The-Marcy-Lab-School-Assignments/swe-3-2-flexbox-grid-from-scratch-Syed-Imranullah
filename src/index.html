<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcy Music</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="img/logo.png" alt="" />
      <h1 class="title">Marcy Music</h1>

      <nav class="header-nav">
        <a href="#">Library</a>
        <a href="#">Explore</a>
        <a href="#">Profile</a>
      </nav>
    </header>

    <main>
      <section id="section">
        <h2>Playlists</h2>

        <div class="playlists">
          <div class="songs">
            <figure>
              <img src="img/playlist-chill.jpg" alt="" />
            </figure>
            Chill Vibes
          </div>
          <div class="songs">
            <figure>
              <img src="img/playlist-focus.jpg" alt="" />
            </figure>
            Focus
          </div>
          <div class="songs">
            <figure>
              <img src="img/playlist-late-night.jpg" alt="" />
            </figure>
            Late Night
          </div>
          <div class="songs">
            <figure>
              <img src="img/playlist-love.jpg" alt="" />
            </figure>
            Love Songs
          </div>
          <div class="songs">
            <figure>
              <img src="img/playlist-oldies.jpg" alt="" />
            </figure>
            Oldies
          </div>
          <div class="songs">
            <figure>
              <img src="img/playlist-sad.jpg" alt="" />
            </figure>
            Sad
          </div>
        </div>
      </section>

      <section id="section">
        <h2>Albums</h2>
        <div class="albums">
          <div class="artist">
            <figure>
              <img src="img/album-midnight-dreams.jpg" alt="" />
            </figure>

            <div class="album-info">
              <p>Midnight Dreams</p>
              <span>Luna Ray</span>
            </div>
          </div>

          <div class="artist">
            <figure>
              <img src="img/album-electric-soul.jpg" alt="" />
            </figure>

            <div class="album-info">
              <p>Electric Soul</p>
              <span>The Voltage</span>
            </div>
          </div>

          <div class="artist">
            <figure>
              <img src="img/album-golden-hour.jpg" alt="" />
            </figure>

            <div class="album-info">
              <p>Golden Hour</p>
              <span>Sunset Collective</span>
            </div>
          </div>

          <div class="artist">
            <figure>
              <img src="img/album-kermit-does-jazz.jpg" alt="" />
            </figure>

            <div class="album-info">
              <p>Kermit Does Jazz</p>
              <span>Kermit The Frog</span>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
  <p>
    Made with ❤️ at
    <a href="https://www.marcylabschool.org/" target="_blank">
      Marcy Lab School
    </a>
  </p>
</footer>
  </body>
</html>
